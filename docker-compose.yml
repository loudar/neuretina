services:
  neuretina:
    image: ghcr.io/targoninc/neuretina:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${NEURETINA_PORT:-8080}:8080"
    volumes:
      - /mnt/neuretina-data:/app/data
    environment:
      # --- Server ---
      TZ: Europe/Berlin # cron and brief dates
      LOG_LEVEL: info
      STARTUP_CHECK: "true"
      STARTUP_ANNOUNCE: "false"

      # --- Access (empty password runs the site without authentication) ---
      # The global password logs in as the admin account.
      AUTH_GLOBAL_PASSWORD: ""
      # Optional: signs sessions; empty derives the key from the password.
      AUTH_SESSION_SECRET: ""
      AUTH_SESSION_TTL_HOURS: "720"
      ADMIN_USERNAME: admin
